# Everyday Q2 check: synthetic maps only, small grids, light load (well under
# a minute on a fanless laptop). Not the study: few maps and queries, and
# RRT* on every 4th query with a small budget. The study is bench_q2.yaml.
roadmap:
  backend: numba
  variant: jfa+2
  bridge_lam: 64  # clearance-weighted bridges: shortest ones caused 23 of the 72 big clearance losses (docs/Q2_HARNESS.md)

q2:
  maps:
    - {kind: random_obstacles, sizes: [128, 256], seeds: [0, 1], n_shapes: 25}
    - {kind: corridor, sizes: [128], gap: 24}
    - {kind: two_rooms, sizes: [120]}
  queries_per_map: 16
  min_dist_frac: 0.333
  seed: 0
  robot_radius: 2.0
  planners: [voronoi, astar, weighted_astar, rrt_star]
  lambdas: [1, 4, 16, 64]
  rrt_iters: 1500
  rrt_every: 4
  cooldown_s: 0.5
  out_dir: runs/bench_q2_quick
  # voronoi_plan settings, one row each (field "variant"); the first is the
  # original planner, so before and after compare on the same queries
  voronoi_variants:
    - {name: nearest}
    - {name: nearest-road16, roadmap_lam: 16}
    - {name: best16, join: best, join_lam: 16, roadmap_lam: 16}
    - {name: best64, join: best, join_lam: 64, roadmap_lam: 64}
  # the same post-process on every planner's path; raw metrics are kept too
  smoothing: [safe, preserve]
