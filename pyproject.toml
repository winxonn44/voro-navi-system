[project]
name = "voronav"
version = "0.1.0"
description = "From-scratch parallel Voronoi roadmaps for offline, segmentation-driven navigation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voronav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
